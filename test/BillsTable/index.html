<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v6 TableBuilder Test</title>
    <!-- Tailwind is required for TableBuilder styling to look correct -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class1="bg-gray-100 p-8 h-screen overflow-auto flex flex-col relative"
    class="ks bg-gray-100 flex flex-col min-h-screen">
    <div id="header"></div>

    <!-- body -->
    <section class="mx-auto px-3 py-6 
                max-w-3xl 
                lg:max-w-5xl 
                xl:max-w-6xl">

        <div id="table-root">
        </div>
    </section>
    <!-- 
    <div id="table-root">
    </div> -->

    <!-- Scroll Buttons -->
    <div class="fixed bottom-8 right-8 flex flex-col gap-3 z-50">
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
            class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full shadow-lg transition-transform hover:scale-110 flex items-center justify-center"
            title="Scroll to Top">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18">
                </path>
            </svg>
        </button>
        <button onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})"
            class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full shadow-lg transition-transform hover:scale-110 flex items-center justify-center"
            title="Scroll to Bottom">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 14l-7 7m0 0l-7-7m7 7V3">
                </path>
            </svg>
        </button>
    </div>
    <!-- <script src="./script.js" type="module"></script> -->
    <!-- <script src="./dist/v5/tableBuilder.umd.cjs"></script> -->
    <script src="../../tableBuilder.js" type="module"></script>

    <script type="module">
        let ksTable1;

        async function init() {
            try {
                // Fetch the data and columns files
                const [dataResponse, columnsResponse] = await Promise.all([
                    fetch("./ItemsTable.json"),
                    fetch("./config.json")
                ]);

                if (!dataResponse.ok) {
                    throw new Error(`Failed to fetch all.json: ${dataResponse.status} ${dataResponse.statusText}`);
                }
                if (!columnsResponse.ok) {
                    throw new Error(`Failed to fetch columns.json: ${columnsResponse.status} ${columnsResponse.statusText}`);
                };

                const configJson = await columnsResponse.json();

                const data = await dataResponse.json();

                configJson.data = data;
                console.log("configJson : ", configJson);

                // debugger
                const tableBuilder = new window.ks.TableBuilder(configJson);
                tableBuilder.appendToDom();

            } catch (error) {
                console.error(error);
                document.getElementById("table-root").innerHTML = `
                    <div class="flex items-center justify-center h-full p-8 text-red-500 font-semibold bg-red-50">
                        Error loading data: ${error.message}
                    </div>
                `;
            }
        };

        init();
    </script>


    <script type="module" src="./index/start.js"></script>

</body>

</html>
